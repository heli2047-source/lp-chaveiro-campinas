<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fundo do Badge / Favicon -->
  <rect width="64" height="64" rx="16" fill="#0A0E17"/>
  
  <!-- Medalhão Circular Cromado (da logo) -->
  <circle cx="32" cy="32" r="28" fill="url(#silverGradient)" stroke="#DA1907" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="25" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 1.5"/>

  <!-- Silhueta da Casa/Telhado (Preto Carbono) -->
  <path d="M19 32L32 20L45 32H40V44H24V32H19Z" fill="#0A0E17"/>
  <path d="M38 23V19H42V26.5L38 23Z" fill="#0A0E17"/>

  <!-- Silhueta do Carro (Vermelho Chaveiro Rodrigues #DA1907) -->
  <!-- Teto e vidro do carro -->
  <path d="M26 36C26.5 33 27.5 31.5 32 31.5C36.5 31.5 37.5 33 38 36H26Z" fill="#DA1907"/>
  <!-- Corpo do carro -->
  <rect x="24" y="35.5" width="16" height="6" rx="2" fill="#DA1907"/>
  <!-- Rodas do carro -->
  <circle cx="27" cy="41.5" r="2.2" fill="#0A0E17"/>
  <circle cx="37" cy="41.5" r="2.2" fill="#0A0E17"/>
  <!-- Faróis -->
  <circle cx="26" cy="37" r="0.9" fill="#FFFFFF"/>
  <circle cx="38" cy="37" r="0.9" fill="#FFFFFF"/>

  <defs>
    <linearGradient id="silverGradient" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1F5F9"/>
      <stop offset="0.5" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
</svg>
